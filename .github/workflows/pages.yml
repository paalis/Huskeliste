name: Publiser på GitHub Pages

on:
  push:
    branches: [main, work]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4
      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Bygg
        run: npm run build
      - name: Konfigurer Pages
        uses: actions/configure-pages@v5
      - name: Last opp nettsiden
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publiser
        id: deployment
        uses: actions/deploy-pages@v4
